<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in is briefly paused</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f7f8fb; }
    main { max-width: 34rem; margin: 12vh auto; padding: 2rem; background: white; border: 1px solid #d9deea; border-radius: 1rem; box-shadow: 0 8px 28px #17203314; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    p { line-height: 1.55; }
    .hint { color: #536078; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Sign-in is briefly paused</h1>
    <p>Too many sign-in requests arrived in a short time. Wait about a minute, then start sign-in again.</p>
    <p><a href="/login">Return to LawHand sign-in</a></p>
    <p class="hint">If you were reconnecting document storage, return to <a href="/admin?tab=integrations&amp;integration=cloud">Cloud settings</a> and restart the connection. If this keeps happening, try again later.</p>
  </main>
</body>
</html>
