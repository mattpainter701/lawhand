# Mergify configuration - read from the default branch (main).
#
# Auto-queue: any PR targeting main that passes the required checks (injected
# from main's branch protection) enters the queue automatically. Mergify then
# tests it against the latest main and merges it once those checks pass, so a
# green PR never needs a manual update-and-rerun when main moves.
#
# main requires no approving review, so this merges green PRs without a human
# click. To return to manual queueing, drop merge_protections_settings below and
# use `@mergifyio queue` (or the queue-control checkbox) instead.

merge_queue:
  # One comment when a PR leaves the queue, instead of a running commentary.
  status_comments: outcomes

merge_protections_settings:
  auto_merge_conditions:
    - base = main

queue_rules:
  - name: default
    # Matches the repository's history: merge commits, not squash.
    merge_method: merge
    # Test each queued PR on its own against the latest main (no batching).
    # Mergify still runs up to `merge_queue.max_parallel_checks` speculative
    # checks in parallel, so the queue moves as fast as CI allows.
    batch_size: 1
