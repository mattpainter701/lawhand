name: Deploy inbound email Worker

on:
  push:
    branches: [main]
    paths:
      - "ops/inbound-email-worker/**"
      - ".github/workflows/deploy-inbound-email-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: law-hand-inbound-email-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Email Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/inbound-email-worker/package-lock.json

      - name: Install and type-check
        working-directory: ops/inbound-email-worker
        run: |
          npm ci
          npm run check

      - name: Deploy exact main revision
        working-directory: ops/inbound-email-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npm run deploy
