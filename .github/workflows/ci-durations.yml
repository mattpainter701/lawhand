name: Refresh backend test durations

# Regenerates backend/tests/ci_durations.json from the per-test JUnit timings
# the backend shard jobs already upload, so shard_tests.py can pack shards by
# measured wall time instead of the database/unit heuristic. Run it after a CI
# run has completed; it opens or updates a PR with the refreshed file. No test
# code changes, and it never runs the suite a second time.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI run to read shard artifacts from (defaults to latest successful main CI)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: lawhand-refresh-test-durations
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh durations from CI timings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1
        with:
          ref: main
          persist-credentials: true

      - name: Resolve the source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -Eeuo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "ERROR: could not resolve a CI run id" >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the shard JUnit reports
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          rm -rf junit
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'backend-junit-shard-*' --dir junit
          find junit -name '*.xml' -print

      - name: Build the durations file
        run: |
          set -Eeuo pipefail
          mapfile -t reports < <(find junit -name '*.xml' | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "ERROR: no JUnit reports found; the source run predates JUnit upload" >&2
            exit 1
          fi
          ( cd backend && python scripts/junit_to_durations.py \
              --output tests/ci_durations.json "${reports[@]/#/../}" )

      - name: Open or update the durations pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- backend/tests/ci_durations.json; then
            echo "durations unchanged; nothing to do"
            exit 0
          fi

          branch="ci/refresh-test-durations"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add backend/tests/ci_durations.json
          git commit -m "ci: refresh backend test durations from run $RUN_ID"
          git push --force-with-lease origin "$branch"

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            echo "updated existing PR #$number"
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "ci: refresh backend test durations" \
            --body "$(cat <<'EOF'
          ## Summary

          Refreshes `backend/tests/ci_durations.json` from the per-test JUnit
          timings uploaded by the backend test shards, so `shard_tests.py
          --durations` packs shards by measured wall time instead of the
          database/unit heuristic. Generated by
          `.github/workflows/ci-durations.yml`; no test code changes.

          ## Validation

          - Each node id keeps its slowest observation across shards, so a test
            that appears in two reports cannot be counted twice.

          ## Merge policy attestations

          - [x] No documentation impact
          - [x] No customer-facing release note
          - [x] Security and privacy impact reviewed
          EOF
          )"
